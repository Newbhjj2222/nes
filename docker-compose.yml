services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nes
      POSTGRES_PASSWORD: nes_password
      POSTGRES_DB: nes
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nes"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nes:nes_password@postgres:5432/nes?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["4000:4000"]

volumes:
  pgdata:
  redisdata:
